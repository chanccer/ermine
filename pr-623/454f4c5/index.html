<main><h1>#623 界面预览</h1><p class="m">commit 454f4c5 · <a href="https://github.com/yetone/magpie/pull/623">回到 PR</a> · 窗口加载后，如果终端里的 `magpie` 命令是拷贝来的文件（而不是安装脚本建立的指向 app 的链接），就弹出一个带「隐藏，直到下一个版本」和「OK」的对话框，标题为「终端里的 `magpie` 命令是一份拷贝」，正文点名该路径并说明它不会随应用更新；点「隐藏，直到下一个版本」会写下按版本记录的静默标记（POST /api/cli-behind/quiet）。快捷面板（mode=panel）刻意不弹这个提示。</p>
